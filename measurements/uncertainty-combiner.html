<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncertainty Combiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>Uncertainty Combiner</h1><span class="spec">AQA 7408 · 3.1.2 combining uncertainties</span></header>
<div class="panel">
 <label for="sc">Calculation</label>
 <select id="sc" style="width:100%;font-family:var(--body);font-size:20px"></select>
 <p class="big" id="eq" style="margin:14px 0 4px"></p>
 <p class="muted" id="rule" style="margin:0"></p>
</div>
<div class="grid2">
 <div class="panel">
  <p style="margin:0 0 10px;font-weight:700">Measurements</p>
  <div class="scroll"><table><thead><tr><th>Quantity</th><th>Value</th><th>± absolute</th><th>Unit</th></tr></thead><tbody id="vars"></tbody></table></div>
  <p class="muted" style="font-size:16px">Change any value or uncertainty and the working updates.</p>
 </div>
 <div class="panel">
  <p style="margin:0 0 10px;font-weight:700">Working</p>
  <div class="steps" id="work"></div>
  <p class="big" id="res" style="margin:14px 0 4px"></p>
  <p class="muted" id="sfnote" style="margin:0"></p>
 </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const S=[
{n:"Density of a cube: ρ = m / L³",eq:"ρ = m / L³",u:"kg m⁻³",k:1,v:[["m","mass",0.0642,0.0001,"kg",1],["L","side length",0.0200,0.0001,"m",-3]]},
{n:"Density of a cylinder: ρ = 4m / (πd²h)",eq:"ρ = 4m / (π d² h)",u:"kg m⁻³",k:4/Math.PI,v:[["m","mass",0.0215,0.0001,"kg",1],["d","diameter",0.0124,0.00001,"m",-2],["h","height",0.0213,0.00002,"m",-1]]},
{n:"Resistivity of a wire: ρ = RA / L = πd²R / (4L)",eq:"ρ = π d² R / (4L)",u:"Ω m",k:Math.PI/4,v:[["R","resistance",3.8,0.1,"Ω",1],["d","diameter",0.00036,0.00001,"m",2],["L","length",0.600,0.002,"m",-1]]},
{n:"Speed: v = s / t",eq:"v = s / t",u:"m s⁻¹",k:1,v:[["s","distance",1.50,0.01,"m",1],["t","time",0.62,0.05,"s",-1]]},
{n:"Kinetic energy: Eₖ = ½mv²",eq:"Eₖ = ½ m v²",u:"J",k:0.5,v:[["m","mass",0.250,0.001,"kg",1],["v","speed",3.2,0.1,"m s⁻¹",2]]},
{n:"Pendulum: g = 4π²L / T²",eq:"g = 4π² L / T²",u:"m s⁻²",k:4*Math.PI*Math.PI,v:[["L","length",0.800,0.002,"m",1],["T","period",1.80,0.02,"s",-2]]},
{n:"Difference: extension e = L − L₀",eq:"e = L − L₀",u:"mm",sum:true,v:[["L","stretched length",342,1,"mm",1],["L₀","original length",305,1,"mm",-1]]}];
S.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=s.n;$("sc").appendChild(o)});
function sup(n){return "10<sup>"+String(n).replace("-","−")+"</sup>"}
function fmt(x,n){if(x===0)return"0";let e=Math.floor(Math.log10(Math.abs(x)));let m=(x/Math.pow(10,e)).toPrecision(n);if(Math.abs(+m)>=10){e++;m=(x/Math.pow(10,e)).toPrecision(n)}return (e>=-2&&e<=3)?(+m*Math.pow(10,e)).toPrecision(n).replace(/(\.\d*?)0+e/,"$1e"):m+"×"+sup(e)}
function round1(u){const e=Math.floor(Math.log10(u));return [Math.round(u/Math.pow(10,e))*Math.pow(10,e),e]}
let cur=null;
function load(){cur=JSON.parse(JSON.stringify(S[$("sc").value]));cur.k=S[$("sc").value].k;
 $("eq").textContent=cur.eq;$("rule").textContent=cur.sum?"Adding or subtracting: add the absolute uncertainties.":"Multiplying, dividing and powers: add the percentage uncertainties, and multiply by the power.";
 $("vars").innerHTML=cur.v.map((v,i)=>`<tr><td><b class="mono">${v[0]}</b> <span class="muted">${v[1]}</span></td><td><input id="v${i}" type="number" step="any" value="${v[2]}" style="width:130px"></td><td><input id="u${i}" type="number" step="any" value="${v[3]}" style="width:120px"></td><td class="mono">${v[4]}</td></tr>`).join("");
 cur.v.forEach((v,i)=>{$("v"+i).oninput=calc;$("u"+i).oninput=calc});calc()}
function calc(){const V=cur.v.map((v,i)=>[+$("v"+i).value,Math.abs(+$("u"+i).value)]);let lines=[],val,abs;
 if(V.some(x=>isNaN(x[0])||isNaN(x[1]))){return}
 if(cur.sum){val=V[0][0]-V[1][0];abs=V[0][1]+V[1][1];
  lines.push(`${cur.v[0][0]} − ${cur.v[1][0]} = ${V[0][0]} − ${V[1][0]} = ${fmt(val,4)} ${cur.u}`);
  lines.push(`Δe = ${V[0][1]} + ${V[1][1]} = ${fmt(abs,3)} ${cur.u}`);
  lines.push(`% uncertainty = ${fmt(abs,3)} / ${fmt(val,4)} × 100 = ${(abs/Math.abs(val)*100).toFixed(1)} %`);
 } else {val=cur.k;let pct=0;
  V.forEach((x,i)=>{val*=Math.pow(x[0],cur.v[i][5]);const p=x[1]/Math.abs(x[0])*100;const pw=Math.abs(cur.v[i][5]);pct+=pw*p;
   lines.push(`%${cur.v[i][0]} = ${x[1]} / ${x[0]} × 100 = ${p.toFixed(2)} %${pw!==1?`  → × ${pw} = ${(pw*p).toFixed(2)} %`:""}`)});
  lines.push(`total % uncertainty = ${pct.toFixed(2)} %`);
  lines.push(`value = ${fmt(val,4)} ${cur.u}`);abs=val*pct/100;
  lines.push(`absolute = ${pct.toFixed(2)} % × ${fmt(val,4)} = ${fmt(abs,3)} ${cur.u}`)}
 $("work").innerHTML=lines.map(l=>`<div>${l}</div>`).join("");
 const [ar,e]=round1(Math.abs(abs));const dpv=Math.round(val/Math.pow(10,e))*Math.pow(10,e);
 const E=Math.floor(Math.log10(Math.abs(val)));const lhs=cur.eq.split("=")[0];
 if(E>=3||E<=-3){const d=Math.max(0,E-e);$("res").innerHTML=`${lhs}= (${(dpv/Math.pow(10,E)).toFixed(d)} ± ${(ar/Math.pow(10,E)).toFixed(d)}) × ${sup(E)} ${cur.u}`}
 else{$("res").innerHTML=`${lhs}= ${dpv.toFixed(Math.max(0,-e))} ± ${ar.toFixed(Math.max(0,-e))} ${cur.u}`}
 $("sfnote").textContent="Uncertainty rounded to 1 significant figure; the value is rounded to the same decimal place as the uncertainty.";}
$("sc").onchange=load;load();
</script>

</body>
</html>
