<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powers of Ten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>Powers of Ten</h1><span class="spec">AQA 7408 · 3.1.3 estimation and orders of magnitude</span></header>
<div class="tabs" role="tablist">
<button role="tab" aria-selected="true" data-t="quiz">Order of magnitude quiz</button>
<button role="tab" aria-selected="false" data-t="fermi">Fermi estimate builder</button>
</div>
<section id="quiz" class="panel">
 <p class="muted" style="margin:0">Estimate the quantity to the nearest order of magnitude. Commit on mini whiteboards first, then set the slider.</p>
 <p class="big" id="qq" style="margin:14px 0 6px"></p>
 <label for="ex">Your estimate: <span class="mono" id="exv" style="font-size:24px"></span></label>
 <input id="ex" type="range" min="-15" max="30" step="1" value="0">
 <canvas id="scale" width="1140" height="70" aria-label="Powers of ten scale"></canvas>
 <div class="row" style="margin-top:12px"><button class="go" id="reveal">Reveal</button><button class="ghost" id="nxt">Next quantity</button></div>
 <p id="fb" style="font-size:20px;min-height:2.6em;margin:12px 0 0"></p>
</section>
<section id="fermi" class="grid2" hidden>
 <div class="panel">
  <label for="fp">Problem</label><select id="fp" style="width:100%;font-family:var(--body);font-size:18px"></select>
  <div class="scroll" style="margin-top:12px"><table><thead><tr><th></th><th>Estimate</th><th>Value</th><th>Unit</th></tr></thead><tbody id="ft"></tbody></table></div>
  <p class="muted" style="font-size:16px">Change any estimate. Sensible round numbers are fine: the aim is the right power of ten.</p>
 </div>
 <div class="panel">
  <p style="margin:0 0 10px;font-weight:700">Working</p>
  <div class="steps" id="fw"></div>
  <p class="big" id="fr" style="margin:14px 0 4px"></p>
  <p id="fo" style="font-size:20px;margin:0"></p>
  <p class="muted" id="fn"></p>
 </div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function sup(n){return "10<sup>"+String(n).replace("-","−")+"</sup>"}
function stf(x){if(x===0)return"0";let e=Math.floor(Math.log10(Math.abs(x)));let m=(x/Math.pow(10,e)).toPrecision(2);if(+m>=10){e++;m=(x/Math.pow(10,e)).toPrecision(2)}return m+"×"+sup(e)}
function oom(x){return Math.round(Math.log10(Math.abs(x)))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));["quiz","fermi"].forEach(s=>$(s).hidden=s!==b.dataset.t);drawScale()});
const Q=[["Diameter of an atom","m",1e-10],["Diameter of a nucleus","m",1e-14],["Wavelength of green light","m",5e-7],["Thickness of a sheet of paper","m",1e-4],["Mass of an apple","kg",0.1],["Mass of a family car","kg",1.5e3],["Height of a Year 12 student","m",1.7],["Power of a kettle","W",2.5e3],["Energy in a chocolate bar","J",1e6],["Mass of the Earth","kg",6.0e24],["Distance from the Earth to the Sun","m",1.5e11],["Number of heartbeats in a lifetime","",3e9],["Speed of a sprinter","m s⁻¹",10],["Current in a phone charger cable","A",1],["Time for light to cross a room","s",3e-8],["Pressure of the atmosphere","Pa",1e5],["Mass of a raindrop","kg",3e-6],["Number of people in the UK","",6.9e7]];
let qi=0,order=[];function shuffle(){order=Q.map((_,i)=>i).sort(()=>Math.random()-.5);qi=0}
function showQ(){const q=Q[order[qi]];$("qq").textContent=q[0]+(q[1]?" ("+q[1]+")":"");$("fb").textContent="";$("ex").value=0;upd();drawScale()}
function upd(){$("exv").innerHTML=sup($("ex").value)+($("qq").textContent.includes("(")?" "+Q[order[qi]][1]:"")}
function drawScale(ans){const c=$("scale"),dpr=window.devicePixelRatio||1,w=c.clientWidth||1100,h=70;c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
 const X=e=>12+(e+15)/45*(w-24);g.strokeStyle=css("--line");g.lineWidth=2;g.beginPath();g.moveTo(X(-15),30);g.lineTo(X(30),30);g.stroke();g.fillStyle=css("--muted");g.font="13px "+css("--mono");g.textAlign="center";
 for(let e=-15;e<=30;e++){g.beginPath();g.moveTo(X(e),24);g.lineTo(X(e),36);g.stroke();if(e%5===0)g.fillText(e,X(e),56)}
 const me=+$("ex").value;g.beginPath();g.arc(X(me),30,9,0,7);g.fillStyle=css("--accent");g.fill();
 if(ans!==undefined){g.beginPath();g.arc(X(ans),30,9,0,7);g.fillStyle=css("--good");g.fill();g.fillStyle=css("--good");g.fillText("answer",X(ans),14)}}
$("ex").oninput=()=>{upd();drawScale()};
$("reveal").onclick=()=>{const q=Q[order[qi]];const a=oom(q[2]);const d=Math.abs(a-+$("ex").value);
 $("fb").innerHTML=`Typical value ≈ <span class="mono">${stf(q[2])} ${q[1]}</span>, so order of magnitude ${sup(a)}. `+(d===0?'<span class="good">Spot on.</span>':d===1?'<span class="warm">Within one order: a reasonable estimate.</span>':`<span class="bad">Out by ${d} orders of magnitude: a factor of ${sup(d)}.</span>`);drawScale(a)};
$("nxt").onclick=()=>{qi=(qi+1)%Q.length;if(qi===0)shuffle();showQ()};
window.addEventListener("resize",()=>drawScale());shuffle();showQ();
// fermi
const F=[
{n:"Energy used charging every phone in the UK for a year",u:"J",f:[["×","phones in use in the UK",6e7,""],["×","energy stored in one full battery (≈15 W h)",5.4e4,"J"],["×","full charges per phone per year",365,""]],note:"For scale: total UK electricity use is about 10¹⁸ J per year."},
{n:"Mass of air in this classroom",u:"kg",f:[["×","length of room",10,"m"],["×","width of room",8,"m"],["×","height of room",3,"m"],["×","density of air",1.2,"kg m⁻³"]],note:"Roughly the mass of four Year 12 students."},
{n:"Kinetic energy of a sprinting student",u:"J",f:[["×","½",0.5,""],["×","mass of student",65,"kg"],["×","top speed",8,"m s⁻¹"],["×","top speed (again, for v²)",8,"m s⁻¹"]],note:"Compare with the energy in a chocolate bar, about 10⁶ J."},
{n:"Number of times your heart beats in a lifetime",u:"",f:[["×","beats per minute",70,"min⁻¹"],["×","minutes per hour",60,""],["×","hours per day",24,""],["×","days per year",365,""],["×","years in a lifetime",80,""]],note:"Most mammals get roughly 10⁹ heartbeats, whatever their size."},
{n:"Number of grains of sand in a bucket",u:"",f:[["×","volume of bucket (10 litres)",0.01,"m³"],["÷","volume of one grain (0.5 mm cube)",1.25e-10,"m³"]],note:"Ignoring gaps between grains makes this an overestimate."}];
F.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.n;$("fp").appendChild(o)});
function loadF(){const p=F[$("fp").value];$("ft").innerHTML=p.f.map((x,i)=>`<tr><td class="mono" style="font-size:22px">${i===0&&x[0]==="×"?"":x[0]}</td><td>${x[1]}</td><td><input id="f${i}" type="number" step="any" value="${x[2]}" style="width:150px"></td><td class="mono">${x[3]}</td></tr>`).join("");p.f.forEach((_,i)=>$("f"+i).oninput=calcF);calcF()}
function calcF(){const p=F[$("fp").value];let v=1;const parts=[];p.f.forEach((x,i)=>{const n=+$("f"+i).value;v=x[0]==="÷"?v/n:v*n;parts.push((i?" "+x[0]+" ":"")+stf(n))});
 $("fw").innerHTML=`<div>${parts.join("")}</div><div>= ${stf(v)} ${p.u}</div>`;$("fr").innerHTML=`≈ ${stf(v)} ${p.u}`;$("fo").innerHTML=`Order of magnitude: <b>${sup(oom(v))} ${p.u}</b>`;$("fn").textContent=p.note}
$("fp").onchange=loadF;loadF();
</script>

</body>
</html>
