<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Behaviour Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.formula{font-family:var(--mono);font-size:20px;padding:10px 14px;background:var(--soft);border-radius:10px;overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px}
.kv b{font-weight:700}
.note{font-size:16px;color:var(--muted)}
.callout{border-left:5px solid var(--warm);background:var(--soft);padding:10px 14px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}

.sym{font-family:var(--mono);font-size:22px;font-weight:600}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.answer{font-size:20px;font-weight:700;min-height:1.6em}

</style>
<script>
const $=id=>document.getElementById(id);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const EPS0=8.85e-12, K=1/(4*Math.PI*8.85e-12), E_CH=1.60e-19, ME_=9.11e-31, MP=1.673e-27, G=6.67e-11;
/* number in standard form as HTML, n significant figures */
function sf(x,n=3){
  if(x===0)return "0";
  if(!isFinite(x))return "∞";
  const neg=x<0;x=Math.abs(x);
  let e=Math.floor(Math.log10(x));let m=x/Math.pow(10,e);let ms=m.toPrecision(n);
  if(parseFloat(ms)>=10){e++;ms=(m/10).toPrecision(n);}
  let s;
  if(e>=-2&&e<n&&e<=3){s=x.toPrecision(n);if(s.includes("e"))s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";}
  else s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";
  return (neg?"−":"")+s;
}
/* plain-text version for canvas labels */
function sft(x,n=3){return sf(x,n).replace(/<sup>/g,"^").replace(/<\/sup>/g,"").replace(" × 10^","e").replace(/e(−?\d+)/,(a,b)=>"×10"+sup(b));}
function sup(s){const m={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","−":"⁻","-":"⁻"};return String(s).split("").map(c=>m[c]||c).join("");}
function setup(c,aspect){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth||600,h=Math.round(w*aspect);
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+"px";
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  return {g,w,h};
}
function niceStep(range,target){const raw=range/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
/* axes: box {x,y,w,h}; returns mapping functions */
function axes(g,box,xmin,xmax,ymin,ymax,opt={}){
  const X=x=>box.x+(x-xmin)/(xmax-xmin)*box.w, Y=y=>box.y+box.h-(y-ymin)/(ymax-ymin)*box.h;
  const ink=cv("--ink"),line=cv("--line"),muted=cv("--muted");
  g.save();g.font="14px "+cv("--body");g.lineWidth=1;
  const xs=opt.xstep||niceStep(xmax-xmin,6), ys=opt.ystep||niceStep(ymax-ymin,5);
  g.strokeStyle=line;g.fillStyle=muted;g.textAlign="center";g.textBaseline="top";
  for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9*xs;x+=xs){g.beginPath();g.moveTo(X(x),box.y);g.lineTo(X(x),box.y+box.h);g.stroke();g.fillText(opt.xfmt?opt.xfmt(x):+x.toPrecision(3),X(x),Math.min(box.y+box.h,Math.max(box.y,Y(0)))+4);}
  g.textAlign="right";g.textBaseline="middle";
  for(let y=Math.ceil(ymin/ys)*ys;y<=ymax+1e-9*ys;y+=ys){g.beginPath();g.moveTo(box.x,Y(y));g.lineTo(box.x+box.w,Y(y));g.stroke();g.fillText(opt.yfmt?opt.yfmt(y):+y.toPrecision(3),box.x-6,Y(y));}
  g.strokeStyle=ink;g.lineWidth=2;g.beginPath();
  const y0=Math.min(box.y+box.h,Math.max(box.y,Y(0)));g.moveTo(box.x,y0);g.lineTo(box.x+box.w,y0);
  g.moveTo(box.x,box.y);g.lineTo(box.x,box.y+box.h);g.stroke();
  g.fillStyle=ink;g.font="bold 15px "+cv("--body");
  if(opt.xl){g.textAlign="right";g.textBaseline="bottom";g.fillText(opt.xl,box.x+box.w,y0-4);}
  if(opt.yl){g.textAlign="left";g.textBaseline="top";g.fillText(opt.yl,box.x+6,box.y-2);}
  g.restore();
  return {X,Y};
}
function arrow(g,x1,y1,x2,y2,col,wid=3,head=10){
  const a=Math.atan2(y2-y1,x2-x1);g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=wid;
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));g.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));g.closePath();g.fill();g.restore();
}
function tabs(onchange){
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
    document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab);
    if(onchange)onchange(b.dataset.tab);
  }));
}
function onResize(f){let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(f,80);});
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",f);}
</script>
</head>
<body>
<div class="wrap">
<header class="top"><h1>Material Behaviour Explorer</h1><span class="spec">AQA 7408 · 3.4.2.1 elastic, plastic, brittle and ductile behaviour</span></header>
<div class="tabs" role="tablist">
 <button data-tab="explore" aria-selected="true">Load and unload</button>
 <button data-tab="quiz" aria-selected="false">Name that material</button>
</div>
<div class="grid2">
 <div class="panel"><canvas id="graph" aria-label="Force against extension for the chosen material"></canvas>
  <div class="legend" style="margin-top:8px"><span style="--c:var(--accent)">loading</span><span style="--c:var(--warm)">unloading</span><span style="--c:var(--line)">full curve (dashed)</span></div></div>
 <div class="panel">
  <div data-panel="explore">
   <label>Material (a thin sample about 2 m long)</label>
   <div class="pill" id="mat"></div>
   <label for="F" style="margin-top:14px">Applied force: <span class="mono" id="Fv"></span></label>
   <input type="range" id="F" min="0" max="1" step="0.005" value="0">
   <div class="row" style="margin-top:8px"><button class="ghost" id="reset">New sample</button><span class="chip" id="ext"></span></div>
   <div class="answer" id="state" aria-live="polite" style="margin-top:10px"></div>
   <div class="callout" id="why" style="margin-top:10px"></div>
  </div>
  <div data-panel="quiz" hidden>
   <p style="margin-top:0">The graph shows a force–extension curve, with unloading if it was done. Which material is it most likely to be?</p>
   <div class="pill" id="guess"><button data-v="copper">ductile metal (copper)</button><button data-v="glass">brittle (glass)</button><button data-v="rubber">rubber</button><button data-v="poly">polythene</button></div>
   <div class="answer" id="verdict" style="margin-top:12px" aria-live="polite"></div>
   <div class="row" style="margin-top:10px"><button class="go" id="next">Next graph</button><span class="chip" id="score">0 / 0</span></div>
  </div>
 </div>
</div>
<script>
/* Each model gives loading force f(x) on a 0..1 scale of the sample's range, plus how it unloads. */
const M={
 copper:{name:"Copper (ductile)",Fs:25,Xs:120,k:12,fe:0.36,fb:0.92,
   load:x=>x<0.03?12*x:0.36+0.58*(1-Math.exp(-(x-0.03)/0.22)),un:"parallel",
   why:"Metal ions sit in a lattice held by bonds that act like springs, so small loads give elastic, Hooke's-law stretching. Past the elastic limit, layers of ions slip past each other (dislocations move): the wire flows plastically, gets thinner and finally necks and breaks. Unloading is a line parallel to the original slope, so there is a permanent extension."},
 glass:{name:"Glass (brittle)",Fs:25,Xs:120,k:12,fe:0.6,fb:0.6,load:x=>12*x,un:"parallel",
   why:"Glass obeys Hooke's law right up to fracture. There is no plastic region: a tiny surface crack spreads straight through the sample, so it snaps with no permanent stretch first. That is brittle behaviour."},
 rubber:{name:"Rubber",Fs:25,Xs:120,k:0,fe:1.1,fb:1.1,load:x=>0.42*Math.tanh(x/0.18)+0.75*Math.pow(x,3),un:"hyst",
   why:"Long tangled polymer chains straighten out as rubber is stretched, so the graph is not a straight line (no Hooke's law) but it still returns to its original length: elastic. The unloading curve sits below the loading curve. The area between them is energy transferred to internal (thermal) energy: hysteresis."},
 poly:{name:"Polythene",Fs:25,Xs:120,k:9,fe:0.27,fb:0.62,load:x=>x<0.03?9*x:0.27+0.38*(x-0.03),un:"parallel",
   why:"Polythene is elastic only for a tiny strain. Then the polymer chains slide and line up (cold drawing), so it stretches a long way for very little extra force. It is plastic: most of that extension stays when the load is removed."}
};
let key="copper",st,mode="explore",quiz=null,score=[0,0];
function invert(f,F){let a=0,b=1.2;for(let i=0;i<50;i++){const c=(a+b)/2;if(f(c)<F)a=c;else b=c;}return (a+b)/2;}
function fresh(){st={fmax:0,xmax:0,broken:false,path:[[0,0]],dir:1,F:0};$("F").value=0;}
function extAt(F){const m=M[key];
  if(F>=st.fmax-1e-9){return invert(m.load,F);}
  if(m.un==="hyst"){const xm=st.xmax;let a=0,b=xm;const fu=x=>m.load(x)*Math.pow(x/xm,1.6);for(let i=0;i<50;i++){const c=(a+b)/2;if(fu(c)<F)a=c;else b=c;}return (a+b)/2;}
  return st.xmax-(st.fmax-F)/m.k;}
function setF(F){const m=M[key];if(st.broken)return;
  if(F>=m.fb){const x=invert(m.load,m.fb);st.path.push([x,m.fb]);st.broken=true;st.fmax=m.fb;st.xmax=x;draw();return;}
  const x=extAt(F);if(F>st.fmax){st.fmax=F;st.xmax=x;}st.F=F;st.path.push([x,F]);draw();}
function draw(){
  const m=M[key],c=$("graph"),{g,w,h}=setup(c,0.8),box={x:62,y:18,w:w-84,h:h-52};
  const {X,Y}=axes(g,box,0,m.Xs,0,m.Fs,{xl:"extension / mm",yl:"force / N"});
  const sx=x=>X(x*m.Xs/1.0),sy=F=>Y(F*m.Fs);
  if(mode==="explore"){g.strokeStyle=cv("--line");g.setLineDash([6,5]);g.lineWidth=2;g.beginPath();const xb=invert(m.load,m.fb);for(let i=0;i<=200;i++){const x=xb*i/200;i?g.lineTo(sx(x),sy(m.load(x))):g.moveTo(sx(x),sy(m.load(x)));}g.stroke();g.setLineDash([]);}
  const Q=mode==="quiz"&&quiz;const P=Q?quiz.path:st.path;
  for(let i=1;i<P.length;i++){const up=P[i][1]>=P[i-1][1];g.strokeStyle=up?cv("--accent"):cv("--warm");g.lineWidth=4;g.beginPath();g.moveTo(sx(P[i-1][0]),sy(P[i-1][1]));g.lineTo(sx(P[i][0]),sy(P[i][1]));g.stroke();}
  const brk=Q?quiz.broken:st.broken;
  if(brk){const p=P[P.length-1];g.strokeStyle=cv("--bad");g.lineWidth=4;g.beginPath();g.moveTo(sx(p[0])-9,sy(p[1])-9);g.lineTo(sx(p[0])+9,sy(p[1])+9);g.moveTo(sx(p[0])+9,sy(p[1])-9);g.lineTo(sx(p[0])-9,sy(p[1])+9);g.stroke();}
  if(mode==="explore"){
    const p=st.path[st.path.length-1];g.fillStyle=cv("--ink");g.beginPath();g.arc(sx(p[0]),sy(p[1]),6,0,7);g.fill();
    $("Fv").textContent=(st.F*m.Fs).toFixed(1)+" N";$("ext").textContent="extension "+(p[0]*m.Xs).toFixed(1)+" mm";
    const perm=st.fmax>m.fe&&m.un==="parallel"?(st.xmax-st.fmax/m.k)*m.Xs:0;
    $("state").innerHTML=st.broken?'<span class="bad">Fractured.</span> '+(key==="glass"?"No plastic region: brittle.":"It stretched plastically first: ductile."):
      st.fmax<=m.fe?'<span class="good">Elastic so far: it will return to its original length.</span>':
      (m.un==="hyst"?'<span class="good">Elastic (returns to original length) but not Hooke\'s law.</span>':`<span class="bad">Past the elastic limit: permanent extension ${perm.toFixed(1)} mm if fully unloaded.</span>`);
    $("why").innerHTML="<b>"+m.name+".</b> "+m.why;
  }
}
function buildMat(){const box=$("mat");box.innerHTML="";Object.keys(M).forEach(k=>{const b=document.createElement("button");b.textContent=M[k].name;b.setAttribute("aria-pressed",k===key);b.onclick=()=>{key=k;buildMat();fresh();draw();};box.appendChild(b);});}
$("F").addEventListener("input",e=>setF(+e.target.value));
$("reset").onclick=()=>{fresh();draw();};
function newQuiz(){
  quiz=null;const ks=["copper","glass","rubber","poly"];key=ks[Math.floor(Math.random()*4)];fresh();
  const m=M[key];const top=key==="glass"?1:(Math.random()<0.5?m.fb*0.85:1);
  for(let F=0;F<=Math.min(top,m.fb);F+=0.01)setF(F);
  if(!st.broken){if(top<1||key==="rubber")for(let F=st.fmax;F>=0;F-=0.01)setF(Math.max(0,F));else setF(1);}
  quiz={key,path:st.path.slice(),broken:st.broken,done:false};$("verdict").textContent="";draw();}
document.querySelectorAll("#guess button").forEach(b=>b.addEventListener("click",()=>{if(!quiz||quiz.done)return;quiz.done=true;score[1]++;const ok=b.dataset.v===quiz.key;if(ok)score[0]++;
  $("verdict").innerHTML=(ok?'<span class="good">Correct.</span> ':'<span class="bad">Not quite.</span> ')+"It was <b>"+M[quiz.key].name+"</b>. "+M[quiz.key].why.split(". ").slice(0,2).join(". ")+".";$("score").textContent=score[0]+" / "+score[1];}));
$("next").onclick=newQuiz;
tabs(t=>{mode=t;if(t==="quiz")newQuiz();else{fresh();draw();}});
onResize(draw);
buildMat();fresh();draw();
</script>
</div>
</body>
</html>
