<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress–Strain Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.formula{font-family:var(--mono);font-size:20px;padding:10px 14px;background:var(--soft);border-radius:10px;overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px}
.kv b{font-weight:700}
.note{font-size:16px;color:var(--muted)}
.callout{border-left:5px solid var(--warm);background:var(--soft);padding:10px 14px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}

.sym{font-family:var(--mono);font-size:22px;font-weight:600}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.answer{font-size:20px;font-weight:700;min-height:1.6em}

</style>
<script>
const $=id=>document.getElementById(id);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const EPS0=8.85e-12, K=1/(4*Math.PI*8.85e-12), E_CH=1.60e-19, ME_=9.11e-31, MP=1.673e-27, G=6.67e-11;
/* number in standard form as HTML, n significant figures */
function sf(x,n=3){
  if(x===0)return "0";
  if(!isFinite(x))return "∞";
  const neg=x<0;x=Math.abs(x);
  let e=Math.floor(Math.log10(x));let m=x/Math.pow(10,e);let ms=m.toPrecision(n);
  if(parseFloat(ms)>=10){e++;ms=(m/10).toPrecision(n);}
  let s;
  if(e>=-2&&e<n&&e<=3){s=x.toPrecision(n);if(s.includes("e"))s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";}
  else s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";
  return (neg?"−":"")+s;
}
/* plain-text version for canvas labels */
function sft(x,n=3){return sf(x,n).replace(/<sup>/g,"^").replace(/<\/sup>/g,"").replace(" × 10^","e").replace(/e(−?\d+)/,(a,b)=>"×10"+sup(b));}
function sup(s){const m={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","−":"⁻","-":"⁻"};return String(s).split("").map(c=>m[c]||c).join("");}
function setup(c,aspect){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth||600,h=Math.round(w*aspect);
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+"px";
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  return {g,w,h};
}
function niceStep(range,target){const raw=range/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
/* axes: box {x,y,w,h}; returns mapping functions */
function axes(g,box,xmin,xmax,ymin,ymax,opt={}){
  const X=x=>box.x+(x-xmin)/(xmax-xmin)*box.w, Y=y=>box.y+box.h-(y-ymin)/(ymax-ymin)*box.h;
  const ink=cv("--ink"),line=cv("--line"),muted=cv("--muted");
  g.save();g.font="14px "+cv("--body");g.lineWidth=1;
  const xs=opt.xstep||niceStep(xmax-xmin,6), ys=opt.ystep||niceStep(ymax-ymin,5);
  g.strokeStyle=line;g.fillStyle=muted;g.textAlign="center";g.textBaseline="top";
  for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9*xs;x+=xs){g.beginPath();g.moveTo(X(x),box.y);g.lineTo(X(x),box.y+box.h);g.stroke();g.fillText(opt.xfmt?opt.xfmt(x):+x.toPrecision(3),X(x),Math.min(box.y+box.h,Math.max(box.y,Y(0)))+4);}
  g.textAlign="right";g.textBaseline="middle";
  for(let y=Math.ceil(ymin/ys)*ys;y<=ymax+1e-9*ys;y+=ys){g.beginPath();g.moveTo(box.x,Y(y));g.lineTo(box.x+box.w,Y(y));g.stroke();g.fillText(opt.yfmt?opt.yfmt(y):+y.toPrecision(3),box.x-6,Y(y));}
  g.strokeStyle=ink;g.lineWidth=2;g.beginPath();
  const y0=Math.min(box.y+box.h,Math.max(box.y,Y(0)));g.moveTo(box.x,y0);g.lineTo(box.x+box.w,y0);
  g.moveTo(box.x,box.y);g.lineTo(box.x,box.y+box.h);g.stroke();
  g.fillStyle=ink;g.font="bold 15px "+cv("--body");
  if(opt.xl){g.textAlign="right";g.textBaseline="bottom";g.fillText(opt.xl,box.x+box.w,y0-4);}
  if(opt.yl){g.textAlign="left";g.textBaseline="top";g.fillText(opt.yl,box.x+6,box.y-2);}
  g.restore();
  return {X,Y};
}
function arrow(g,x1,y1,x2,y2,col,wid=3,head=10){
  const a=Math.atan2(y2-y1,x2-x1);g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=wid;
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));g.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));g.closePath();g.fill();g.restore();
}
function tabs(onchange){
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
    document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab);
    if(onchange)onchange(b.dataset.tab);
  }));
}
function onResize(f){let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(f,80);});
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",f);}
</script>
</head>
<body>
<div class="wrap">
<header class="top"><h1>Stress–Strain Explorer</h1><span class="spec">AQA 7408 · 3.4.2.1 tensile stress and strain, breaking stress, stress–strain curves</span></header>
<div class="tabs" role="tablist">
 <button data-tab="explore" aria-selected="true">Read the curve</button>
 <button data-tab="quiz" aria-selected="false">Spot the point</button>
</div>
<div class="grid2">
 <div class="panel"><canvas id="graph" aria-label="Stress against strain"></canvas></div>
 <div class="panel">
  <div data-panel="explore">
   <label>Material</label><div class="pill" id="mat"></div>
   <label for="e" style="margin-top:12px">Move along the curve: strain = <span class="mono" id="ev"></span></label>
   <input type="range" id="e" min="0" max="1" step="0.002" value="0.05">
   <div class="steps" id="read" style="margin-top:12px"></div>
   <div class="callout" id="note" style="margin-top:10px"></div>
   <p class="note">Tensile stress = F / A (Pa). Tensile strain = ΔL / L (no unit). In the straight section, gradient = Young modulus.</p>
  </div>
  <div data-panel="quiz" hidden>
   <p style="margin-top:0" id="qq"></p>
   <div class="pill" id="guess"><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button><button data-v="D">D</button><button data-v="E">E</button></div>
   <div class="answer" id="verdict" style="margin-top:12px" aria-live="polite"></div>
   <div class="row" style="margin-top:10px"><button class="go" id="next">Next question</button><span class="chip" id="score">0 / 0</span></div>
  </div>
 </div>
</div>
<script>
/* strains in %, stresses in MPa; key points listed in order along the curve */
const sch=e=>e<=1?4*e:e<=1.4?4+0.7*(e-1)-0.6*(e-1)*(e-1):e<=1.8?4.184-0.5*(e-1.4):(e<=9?3.984+2.4*(1-Math.exp(-(e-1.8)/2.2))-0.04*Math.pow(Math.max(e-6,0),2.2):NaN);
let ue=1.8,us=0;for(let e=1.8;e<=9;e+=0.01){if(sch(e)>us){us=sch(e);ue=e;}}
const M={
 schem:{name:"Ductile metal (schematic, not to scale)",E:null,schem:true,emax:9.6,smax:8,pts:{P:[1,4],E:[1.2,sch(1.2)],Y:[1.4,sch(1.4)],UTS:[ue,us],B:[9,sch(9)]},f:sch,
  note:"The strain axis is stretched near the origin so you can see every point. In a real metal the elastic region is far narrower than the plastic region."},
 steel:{name:"Mild steel",E:200e3,emax:25,smax:520,pts:{P:[0.14,280],E:[0.15,285],Y:[0.18,300],UTS:[15,444],B:[24,359]},
  f:e=>e<=0.14?2000*e:e<=0.18?280+500*(e-0.14)-0:e<=1.5?300-6*(e-0.18):292+158*(1-Math.exp(-(e-1.5)/4))-(e>14?0.9*Math.pow(e-14,2):0),
  note:"Ductile with a clear yield point: after Y the steel stretches at almost constant stress, then work-hardens up to the ultimate tensile strength (UTS). Past UTS the wire necks, so the stress (calculated with the original area) falls until it breaks at B."},
 copper:{name:"Copper",E:120e3,emax:42,smax:260,pts:{P:[0.0583,70],UTS:[30,218],B:[40,188]},
  f:e=>e<=0.0583?1200*e:e<=30?70+150*(1-Math.exp(-(e-0.0583)/7)):70+150*(1-Math.exp(-29.9417/7))-0.3*Math.pow(e-30,2),
  note:"Very ductile, with no sharp yield point. It obeys Hooke's law only for tiny strains, then deforms plastically over a huge strain before necking and breaking."},
 glass:{name:"Glass",E:70e3,emax:0.12,smax:70,pts:{B:[0.07,49]},f:e=>e<=0.07?700*e:NaN,
  note:"Brittle: a straight line right up to fracture. The breaking stress is the stress at B. No plastic region, so no warning before it breaks."},
 rubber:{name:"Rubber",E:null,emax:700,smax:20,pts:{B:[650,18]},f:e=>e<=650?6*Math.tanh(e/120)+0.000035*Math.pow(e,2.2):NaN,
  note:"Huge elastic strains (hundreds of %) and no straight section, so no single Young modulus. The curve is elastic: it returns along a lower unloading curve (hysteresis)."}
};
let key="schem",tab="explore",quiz=null,score=[0,0];
function draw(labels,qletters){
  const m=M[key],c=$("graph"),{g,w,h}=setup(c,0.8),box={x:62,y:18,w:w-84,h:h-52};
  const {X,Y}=axes(g,box,0,m.emax,0,m.smax,m.schem?{xl:"strain (not to scale)",yl:"stress",xfmt:()=>"",yfmt:()=>""}:{xl:"strain / %",yl:"stress / MPa"});
  g.strokeStyle=cv("--accent");g.lineWidth=3;g.beginPath();let first=true;
  for(let i=0;i<=1200;i++){const e=m.emax*i/1200;const s=m.f(e);if(isNaN(s))break;first?g.moveTo(X(e),Y(s)):g.lineTo(X(e),Y(s));first=false;}g.stroke();
  const keys=Object.keys(m.pts);
  keys.forEach((k,i)=>{const [e,s]=m.pts[k];g.fillStyle=cv("--bad");g.beginPath();g.arc(X(e),Y(s),6,0,7);g.fill();
    if(labels||qletters){const off={P:[-30,4],E:[-22,-16],Y:[10,22],UTS:[-14,-14],B:[8,-10]}[k];g.font="bold 16px "+cv("--body");g.fillText(qletters?qletters[k]:k,X(e)+off[0],Y(s)+off[1]);}});
  if(tab==="explore"){const e=+$("e").value*m.emax;const s=m.f(Math.min(e,keys.includes("B")?m.pts.B[0]:e));
    if(!isNaN(s)){g.fillStyle=cv("--warm");g.beginPath();g.arc(X(e),Y(s),8,0,7);g.fill();g.strokeStyle=cv("--warm");g.setLineDash([5,5]);g.lineWidth=1.5;g.beginPath();g.moveTo(X(e),Y(s));g.lineTo(X(e),Y(0));g.moveTo(X(e),Y(s));g.lineTo(X(0),Y(s));g.stroke();g.setLineDash([]);}}
}
function explain(){
  const m=M[key];const e=+$("e").value*m.emax;$("ev").textContent=m.schem?"(schematic)":e.toPrecision(3)+" %";
  const Bk=m.pts.B?m.pts.B[0]:Infinity;
  if(e>Bk){$("read").innerHTML=`<div class="bad">The sample has broken (B).</div>`+(m.schem?"":`<div>breaking stress = ${m.pts.B[1]} MPa = ${sf(m.pts.B[1]*1e6,2)} Pa</div>`);}
  else{const s=m.f(e);const P=m.pts.P?m.pts.P[0]:(m.E?Bk:0);
    const region=m.schem?(e<=1?"Hooke's law region (elastic)":e<=1.2?"elastic but no longer proportional":"plastic: permanent strain if unloaded"):m.E===null?"non-linear, elastic":e<=P?"Hooke's law region (elastic)":(m.pts.E&&e<=m.pts.E[0])?"elastic but no longer proportional":"plastic: permanent strain if unloaded";
    $("read").innerHTML=m.schem?`<div>region: <b>${region}</b></div>`:`<div>stress = ${s.toFixed(0)} MPa = ${sf(s*1e6,3)} Pa</div><div>strain = ${(e/100).toPrecision(3)} (${e.toPrecision(3)} %)</div><div>region: <b>${region}</b></div>`+(m.E?`<div>Young modulus (gradient of straight section) = ${sf(m.E*1e6,2)} Pa</div>`:"");}
  $("note").innerHTML="<b>"+m.name+".</b> "+m.note+(m.pts.P?" <br><b>P</b> limit of proportionality, <b>E</b> elastic limit"+(m.pts.Y?", <b>Y</b> yield point":"")+", <b>UTS</b> ultimate tensile strength (maximum stress), <b>B</b> breaking point.":"");
  draw(true);
}
function buildMat(){const b=$("mat");b.innerHTML="";Object.keys(M).forEach(k=>{const x=document.createElement("button");x.textContent=M[k].name;x.setAttribute("aria-pressed",k===key);x.onclick=()=>{key=k;buildMat();explain();};b.appendChild(x);});}
const QS=[["P","the limit of proportionality"],["E","the elastic limit"],["Y","the yield point"],["UTS","the ultimate tensile strength"],["B","the breaking point"]];
function newQuiz(){key="schem";const m=M[key];const ks=Object.keys(m.pts);const L="ABCDE".split("");
  const shuffled=ks.slice().sort(()=>Math.random()-0.5);const map={};shuffled.forEach((k,i)=>map[k]=L[i]);
  const pick=QS[Math.floor(Math.random()*QS.length)];quiz={map,ans:map[pick[0]],what:pick[1],done:false};
  $("qq").innerHTML="Which letter marks <b>"+pick[1]+"</b>?";$("verdict").textContent="";draw(false,map);}
document.querySelectorAll("#guess button").forEach(b=>b.addEventListener("click",()=>{if(!quiz||quiz.done)return;quiz.done=true;score[1]++;const ok=b.dataset.v===quiz.ans;if(ok)score[0]++;
  $("verdict").innerHTML=(ok?'<span class="good">Correct.</span> ':'<span class="bad">Not quite.</span> ')+quiz.what+" is "+quiz.ans+". Order along the curve: limit of proportionality, elastic limit, yield point, UTS, breaking point.";$("score").textContent=score[0]+" / "+score[1];}));
$("next").onclick=newQuiz;$("e").addEventListener("input",explain);
tabs(t=>{tab=t;if(t==="quiz")newQuiz();else explain();});onResize(()=>tab==="quiz"&&quiz?draw(false,quiz.map):explain());
buildMat();explain();
</script>
</div>
</body>
</html>
