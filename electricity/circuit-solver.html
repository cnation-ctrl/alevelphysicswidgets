<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Problem Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}

.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.formula{font-family:var(--mono);font-size:20px;padding:10px 14px;background:var(--soft);border-radius:10px;overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px}
.kv b{font-weight:700}
.note{font-size:16px;color:var(--muted)}
.callout{border-left:5px solid var(--warm);background:var(--soft);padding:10px 14px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}

<style>body{margin:0}img{max-width:100%}select{max-width:100%;width:100%}.row>div{min-width:min(100%,150px)!important}</style>
<script>
const $=id=>document.getElementById(id);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const EPS0=8.85e-12, K=1/(4*Math.PI*8.85e-12), E_CH=1.60e-19, ME_=9.11e-31, MP=1.673e-27, G=6.67e-11;
/* number in standard form as HTML, n significant figures */
function sf(x,n=3){
  if(x===0)return "0";
  if(!isFinite(x))return "∞";
  const neg=x<0;x=Math.abs(x);
  let e=Math.floor(Math.log10(x));let m=x/Math.pow(10,e);let ms=m.toPrecision(n);
  if(parseFloat(ms)>=10){e++;ms=(m/10).toPrecision(n);}
  let s;
  if(e>=-2&&e<n&&e<=3){s=x.toPrecision(n);if(s.includes("e"))s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";}
  else s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";
  return (neg?"−":"")+s;
}
/* plain-text version for canvas labels */
function sft(x,n=3){return sf(x,n).replace(/<sup>/g,"^").replace(/<\/sup>/g,"").replace(" × 10^","e").replace(/e(−?\d+)/,(a,b)=>"×10"+sup(b));}
function sup(s){const m={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","−":"⁻","-":"⁻"};return String(s).split("").map(c=>m[c]||c).join("");}
function setup(c,aspect){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth||600,h=Math.round(w*aspect);
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+"px";
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  return {g,w,h};
}
function niceStep(range,target){const raw=range/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
/* axes: box {x,y,w,h}; returns mapping functions */
function axes(g,box,xmin,xmax,ymin,ymax,opt={}){
  const X=x=>box.x+(x-xmin)/(xmax-xmin)*box.w, Y=y=>box.y+box.h-(y-ymin)/(ymax-ymin)*box.h;
  const ink=cv("--ink"),line=cv("--line"),muted=cv("--muted");
  g.save();g.font="14px "+cv("--body");g.lineWidth=1;
  const xs=opt.xstep||niceStep(xmax-xmin,6), ys=opt.ystep||niceStep(ymax-ymin,5);
  g.strokeStyle=line;g.fillStyle=muted;g.textAlign="center";g.textBaseline="top";
  for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9*xs;x+=xs){g.beginPath();g.moveTo(X(x),box.y);g.lineTo(X(x),box.y+box.h);g.stroke();g.fillText(opt.xfmt?opt.xfmt(x):+(Math.abs(x)<1e-9*xs?0:x).toPrecision(3),X(x),Math.min(box.y+box.h,Math.max(box.y,Y(0)))+4);}
  g.textAlign="right";g.textBaseline="middle";
  for(let y=Math.ceil(ymin/ys)*ys;y<=ymax+1e-9*ys;y+=ys){g.beginPath();g.moveTo(box.x,Y(y));g.lineTo(box.x+box.w,Y(y));g.stroke();g.fillText(opt.yfmt?opt.yfmt(y):+(Math.abs(y)<1e-9*ys?0:y).toPrecision(3),box.x-6,Y(y));}
  g.strokeStyle=ink;g.lineWidth=2;g.beginPath();
  const y0=Math.min(box.y+box.h,Math.max(box.y,Y(0)));g.moveTo(box.x,y0);g.lineTo(box.x+box.w,y0);
  g.moveTo(box.x,box.y);g.lineTo(box.x,box.y+box.h);g.stroke();
  g.fillStyle=ink;g.font="bold 15px "+cv("--body");
  if(opt.xl){g.textAlign="right";g.textBaseline="bottom";g.fillText(opt.xl,box.x+box.w,y0-4);}
  if(opt.yl){g.textAlign="left";g.textBaseline="top";g.fillText(opt.yl,box.x+6,box.y-2);}
  g.restore();
  return {X,Y};
}
function arrow(g,x1,y1,x2,y2,col,wid=3,head=10){
  const a=Math.atan2(y2-y1,x2-x1);g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=wid;
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));g.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));g.closePath();g.fill();g.restore();
}
function tabs(onchange){
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
    document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab);
    if(onchange)onchange(b.dataset.tab);
  }));
}
function onResize(f){let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(f,80);});
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",f);}

</script>
<script>
/* Circuit drawing helpers: draw a component between two points (horizontal or vertical) */
const CIRC={
  lw:2.5,
  wire(g,pts,col){g.save();g.strokeStyle=col||cv("--ink");g.lineWidth=CIRC.lw;g.lineJoin="round";g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke();g.restore();},
  dot(g,x,y){g.save();g.fillStyle=cv("--ink");g.beginPath();g.arc(x,y,4,0,7);g.fill();g.restore();},
  /* type: R, lamp, diode, cell, battery, A, V, therm, ldr, varR, switchO, switchC, bulb; size = symbol length in px */
  comp(g,type,x1,y1,x2,y2,opt={}){
    const ink=opt.col||cv("--ink"),L=Math.hypot(x2-x1,y2-y1),a=Math.atan2(y2-y1,x2-x1),s=opt.size||Math.min(60,L*0.6);
    g.save();g.translate(x1,y1);g.rotate(a);g.strokeStyle=ink;g.fillStyle=ink;g.lineWidth=CIRC.lw;g.lineCap="round";
    const m=L/2,h=s/2;
    const lead=(w)=>{g.beginPath();g.moveTo(0,0);g.lineTo(m-w,0);g.moveTo(m+w,0);g.lineTo(L,0);g.stroke();};
    const panel=cv("--panel");
    if(type==="R"||type==="therm"||type==="ldr"||type==="varR"){
      lead(h);g.fillStyle=panel;g.fillRect(m-h,-s*0.18,s,s*0.36);g.strokeRect(m-h,-s*0.18,s,s*0.36);
      if(type==="therm"){g.beginPath();g.moveTo(m-h-6,s*0.32);g.lineTo(m-h+8,s*0.32);g.lineTo(m+h-4,-s*0.32);g.stroke();}
      if(type==="varR"){g.beginPath();g.moveTo(m-h*0.8,s*0.36);g.lineTo(m+h*0.8,-s*0.36);g.stroke();CIRC._head(g,m-h*0.8,s*0.36,m+h*0.8,-s*0.36,ink);}
      if(type==="ldr"){g.beginPath();g.arc(m,0,s*0.62,0,7);g.stroke();
        for(const dx of[-8,6]){CIRC._arrow(g,m+dx-14,-s*0.95,m+dx-2,-s*0.62,ink);} }
    }else if(type==="lamp"){
      const r=s*0.3;lead(r);g.fillStyle=panel;g.beginPath();g.arc(m,0,r,0,7);g.fill();g.stroke();
      g.beginPath();g.moveTo(m-r*0.7,-r*0.7);g.lineTo(m+r*0.7,r*0.7);g.moveTo(m-r*0.7,r*0.7);g.lineTo(m+r*0.7,-r*0.7);g.stroke();
    }else if(type==="A"||type==="V"){
      const r=s*0.3;lead(r);g.fillStyle=panel;g.beginPath();g.arc(m,0,r,0,7);g.fill();g.stroke();
      g.save();g.translate(m,0);g.rotate(-a);g.fillStyle=ink;g.font="bold "+Math.round(r*1.1)+"px "+cv("--body");g.textAlign="center";g.textBaseline="middle";g.fillText(type,0,1);g.restore();
    }else if(type==="diode"){
      const w=s*0.25;lead(w);g.beginPath();g.moveTo(m-w,-w);g.lineTo(m-w,w);g.lineTo(m+w,0);g.closePath();g.fill();
      g.beginPath();g.moveTo(m+w,-w);g.lineTo(m+w,w);g.stroke();
    }else if(type==="cell"||type==="battery"){
      const gap=7,n=type==="battery"?2:1,w=n*gap*2;lead(w/2);
      for(let i=0;i<n;i++){const xl=m-w/2+i*gap*2;g.lineWidth=CIRC.lw;g.beginPath();g.moveTo(xl,-s*0.38);g.lineTo(xl,s*0.38);g.stroke();
        g.lineWidth=CIRC.lw*2;g.beginPath();g.moveTo(xl+gap,-s*0.2);g.lineTo(xl+gap,s*0.2);g.stroke();}
      if(n===2){g.setLineDash([3,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(m-w/2+gap,0);g.lineTo(m-w/2+gap*2,0);g.stroke();g.setLineDash([]);}
    }else if(type==="switchO"||type==="switchC"){
      lead(h*0.6);CIRC.dot(g,m-h*0.6,0);CIRC.dot(g,m+h*0.6,0);g.beginPath();g.moveTo(m-h*0.6,0);
      if(type==="switchO")g.lineTo(m+h*0.5,-h*0.5);else g.lineTo(m+h*0.6,0);g.stroke();
    }else{lead(0);}
    g.restore();
    if(opt.label){g.save();g.fillStyle=opt.lcol||ink;g.font=(opt.lfont||"bold 15px ")+cv("--body");
      const mx=(x1+x2)/2,my=(y1+y2)/2,horiz=Math.abs(y2-y1)<1;const off=opt.loff||(s*0.45+12);
      if(horiz){g.textAlign="center";g.textBaseline=opt.below?"top":"bottom";g.fillText(opt.label,mx,my+(opt.below?off:-off));}
      else{g.textAlign=opt.left?"right":"left";g.textBaseline="middle";g.fillText(opt.label,mx+(opt.left?-off:off),my);}
      g.restore();}
  },
  _head(g,x1,y1,x2,y2,c){const a=Math.atan2(y2-y1,x2-x1),hd=8;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-hd*Math.cos(a-0.45),y2-hd*Math.sin(a-0.45));g.lineTo(x2-hd*Math.cos(a+0.45),y2-hd*Math.sin(a+0.45));g.closePath();g.fillStyle=c;g.fill();},
  _arrow(g,x1,y1,x2,y2,c){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();CIRC._head(g,x1,y1,x2,y2,c);},
  /* small current arrow on a wire */
  iarrow(g,x,y,dir,col,label){const d={r:[1,0],l:[-1,0],u:[0,-1],d:[0,1]}[dir];g.save();g.fillStyle=col;g.strokeStyle=col;
    g.beginPath();g.moveTo(x+d[0]*8,y+d[1]*8);g.lineTo(x-d[0]*6+d[1]*7,y-d[1]*6+d[0]*7);g.lineTo(x-d[0]*6-d[1]*7,y-d[1]*6-d[0]*7);g.closePath();g.fill();
    if(label){g.font="bold 15px "+cv("--body");g.textAlign=d[0]?"center":"left";g.textBaseline=d[0]?"bottom":"middle";g.fillText(label,x+(d[0]?0:12),y+(d[0]?-10:0));}
    g.restore();}
};
function fmt(x,n=3){return sf(x,n);}
function rnd(a,b,step){const n=Math.round((b-a)/step);return +(a+step*Math.floor(Math.random()*(n+1))).toFixed(6);}
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* generic quiz engine: gen() returns {txt, ans, w (working html), unit, tol} */
function quiz(gen){let Q={},score=0,tries=0;
  function nq(){Q=gen();$("qtext").innerHTML=Q.txt;$("qa").value="";$("qfb").innerHTML="";$("qunit").innerHTML=Q.unit||"";}
  function ck(){const a=parseFloat(String($("qa").value).replace("−","-"));const tol=Q.tol||0.02;const ok=isFinite(a)&&Math.abs(a-Q.ans)<=tol*Math.abs(Q.ans)+1e-12;tries++;if(ok)score++;
    $("qfb").innerHTML=`<div class="${ok?"good":"bad"}"><b>${ok?"Correct.":"Not quite."}</b> Answer: ${sf(Q.ans,3)} ${Q.unit||""}</div>`+Q.w.map(x=>`<div>${x}</div>`).join("");
    $("score").innerHTML=`<b>Score</b><span>${score} / ${tries}</span>`;}
  $("qcheck").onclick=ck;$("qnew").onclick=nq;$("qa").addEventListener("keydown",e=>{if(e.key==="Enter")ck();});nq();}
</script>

<body>
<div class="wrap">
<header class="top"><h1>Circuit Problem Solver</h1><span class="spec">AQA 7408 · 3.5.1.4 · combination circuits step by step</span></header>
<div class="tabs" role="tablist"><button data-tab="solve" aria-selected="true">Solve a circuit</button><button data-tab="what" aria-selected="false">What happens if…?</button></div>
<div data-panel="solve" class="grid2">
 <div class="panel"><canvas id="cc" aria-label="Combination circuit diagram"></canvas><p id="q" style="font-size:21px;margin-bottom:0"></p></div>
 <div class="panel">
  <div class="row"><div><label for="qa">Your answer <span id="qu" class="muted"></span></label><input type="text" inputmode="decimal" id="qa" style="width:200px"></div><button class="go" id="chk">Check</button></div>
  <div id="fb" style="margin-top:10px"></div>
  <div class="row" style="margin-top:12px"><button class="ghost" id="next">Show next step</button><button class="ghost" id="all">Show all steps</button><button class="go" id="new">New circuit</button></div>
  <div class="steps" id="steps" style="margin-top:12px"></div>
  <div class="callout" style="margin-top:12px"><b>Strategy</b>: (1) combine parallel parts, (2) add series parts to get R<sub>T</sub>, (3) I = ε/R<sub>T</sub>, (4) pd across each section = IR, (5) split the current in parallel branches using I = V/R. Check with Kirchhoff's laws.</div>
 </div>
</div>
<div data-panel="what" class="grid2" hidden>
 <div class="panel"><canvas id="wc" aria-label="Circuit with a switch"></canvas>
  <div class="row" style="margin-top:10px"><button class="go" id="sw">Close the switch</button></div></div>
 <div class="panel"><p id="wq" style="margin-top:0;font-size:21px"></p><div class="row" id="wopts"></div><div class="steps" id="wfb" style="margin-top:12px"></div>
  <div class="steps" id="wst" style="margin-top:12px"></div></div>
</div>
</div>
<script>
let P={},shown=0;
function gen(){const t=pick(["A","B","C"]),E=pick([6,9,12,24]);
 if(t==="A"){const R1=pick([4,6,10,12]),R2=pick([6,12,20,30]),R3=pick([12,30,60]);const Rp=1/(1/R2+1/R3),RT=R1+Rp,I=E/RT,Vp=I*Rp,I3=Vp/R3;
  const tg=pick(["I3","Vp","I"]);const map={I3:[`the current through R₃`,I3,"A"],Vp:[`the reading on the voltmeter (across R₂ and R₃)`,Vp,"V"],I:[`the ammeter reading`,I,"A"]};
  P={t,E,R:[R1,R2,R3],q:`Find ${map[tg][0]}.`,ans:map[tg][1],u:map[tg][2],steps:[`R₂ ∥ R₃: 1/R = 1/${R2} + 1/${R3} → R = ${sf(Rp)} Ω`,`R<sub>T</sub> = R₁ + ${sf(Rp)} = ${R1} + ${sf(Rp)} = ${sf(RT)} Ω`,`I = ε/R<sub>T</sub> = ${E}/${sf(RT)} = ${sf(I)} A (ammeter)`,`pd across R₁ = IR₁ = ${sf(I*R1)} V, so pd across the parallel part = ${E} − ${sf(I*R1)} = ${sf(Vp)} V`,`I₃ = V/R₃ = ${sf(Vp)}/${R3} = ${sf(I3)} A; I₂ = ${sf(Vp/R2)} A; check ${sf(Vp/R2)} + ${sf(I3)} = ${sf(I)} A ✓`]};}
 if(t==="B"){const R1=pick([10,20,47]),R2=pick([10,30,33]),R3=pick([20,40,100]);const Rs=R1+R2,RT=1/(1/Rs+1/R3),I=E/RT,Ia=E/Rs,V2=Ia*R2;
  const tg=pick(["V2","I","I3"]);const map={V2:["the pd across R₂",V2,"V"],I:["the current from the supply",I,"A"],I3:["the current in R₃",E/R3,"A"]};
  P={t,E,R:[R1,R2,R3],q:`Find ${map[tg][0]}.`,ans:map[tg][1],u:map[tg][2],steps:[`top branch: R₁ + R₂ = ${Rs} Ω (series)`,`each branch has the full ${E} V across it (parallel with the supply)`,`top branch current = ${E}/${Rs} = ${sf(Ia)} A; pd across R₂ = ${sf(Ia)} × ${R2} = ${sf(V2)} V`,`R₃ branch current = ${E}/${R3} = ${sf(E/R3)} A`,`supply current = ${sf(Ia)} + ${sf(E/R3)} = ${sf(I)} A (or ε/R<sub>T</sub> with R<sub>T</sub> = ${sf(RT)} Ω)`]};}
 if(t==="C"){const R1=pick([5,10,15]),R2=pick([20,40]),R3=pick([10,20]),R4=pick([10,20,30]);const Rb=R3+R4,Rp=1/(1/R2+1/Rb),RT=R1+Rp,I=E/RT,Vp=I*Rp,I4=Vp/Rb,V4=I4*R4;
  const tg=pick(["V4","I","I4"]);const map={V4:["the pd across R₄",V4,"V"],I:["the current from the supply",I,"A"],I4:["the current through R₄",I4,"A"]};
  P={t,E,R:[R1,R2,R3,R4],q:`Find ${map[tg][0]}.`,ans:map[tg][1],u:map[tg][2],steps:[`R₃ + R₄ = ${Rb} Ω (series in the lower branch)`,`${R2} Ω ∥ ${Rb} Ω = ${sf(Rp)} Ω`,`R<sub>T</sub> = ${R1} + ${sf(Rp)} = ${sf(RT)} Ω; I = ${E}/${sf(RT)} = ${sf(I)} A`,`pd across the parallel section = ${sf(I)} × ${sf(Rp)} = ${sf(Vp)} V`,`lower branch current = ${sf(Vp)}/${Rb} = ${sf(I4)} A; pd across R₄ = ${sf(I4)} × ${R4} = ${sf(V4)} V`]};}
 shown=0;$("q").innerHTML=`ε = ${E} V, no internal resistance. ${P.q}`;$("qu").textContent=P.u;$("qa").value="";$("fb").innerHTML="";$("steps").innerHTML="";draw();}
function draw(){const {g,w,h}=setup($("cc"),0.7);const L=50,Rr=w-40,T=80,B=h-50,R=P.R;const nm=k=>`R${"₁₂₃₄"[k]} = ${R[k]} Ω`;
 CIRC.wire(g,[[L,T],[L,B],[Rr,B],[Rr,T]]);CIRC.comp(g,"battery",L,B,L+(Rr-L)*0.3,B,{size:36,label:"ε = "+P.E+" V",below:true});
 if(P.t==="A"){CIRC.comp(g,"A",L+(Rr-L)*0.45,B,L+(Rr-L)*0.65,B,{size:40});const xm=L+(Rr-L)*0.4,xa=xm+20,xb=Rr-30,y2=T+(B-T)*0.45;
  CIRC.comp(g,"R",L,T,xm,T,{size:64,label:nm(0),below:true});CIRC.wire(g,[[xm,T],[xa,T],[xa,y2]]);CIRC.wire(g,[[xb,T],[xb,y2]]);CIRC.wire(g,[[xb,T],[Rr,T]]);CIRC.dot(g,xa,T);CIRC.dot(g,xb,T);
  CIRC.comp(g,"R",xa,T,xb,T,{size:56,label:nm(1),below:true});CIRC.comp(g,"R",xa,y2,xb,y2,{size:56,label:nm(2),below:true});
  CIRC.dot(g,xa-10,T);CIRC.dot(g,Rr,T);CIRC.wire(g,[[xa-10,T],[xa-10,T-46],[(xa+Rr)/2-22,T-46]]);CIRC.comp(g,"V",(xa+Rr)/2-22,T-46,(xa+Rr)/2+22,T-46,{size:36});CIRC.wire(g,[[(xa+Rr)/2+22,T-46],[Rr,T-46],[Rr,T]]);}
 if(P.t==="B"){const xa=L+(Rr-L)*0.15,xb=Rr-20,y2=T+(B-T)*0.45;CIRC.wire(g,[[L,T],[xa,T],[xa,y2]]);CIRC.wire(g,[[xb,T],[xb,y2]]);CIRC.dot(g,xa,T);CIRC.dot(g,xb,T);
  const xm=(xa+xb)/2;CIRC.comp(g,"R",xa,T,xm,T,{size:56,label:nm(0)});CIRC.comp(g,"R",xm,T,xb,T,{size:56,label:nm(1)});CIRC.comp(g,"R",xa,y2,xb,y2,{size:56,label:nm(2),below:true});}
 if(P.t==="C"){const xm=L+(Rr-L)*0.3,xa=xm+10,xb=Rr-20,y2=T+(B-T)*0.48;CIRC.comp(g,"R",L,T,xm,T,{size:56,label:nm(0)});CIRC.wire(g,[[xm,T],[xa,T],[xa,y2]]);CIRC.wire(g,[[xb,T],[xb,y2]]);CIRC.dot(g,xa,T);CIRC.dot(g,xb,T);
  CIRC.comp(g,"R",xa,T,xb,T,{size:56,label:nm(1)});const x3=(xa+xb)/2;CIRC.comp(g,"R",xa,y2,x3,y2,{size:50,label:nm(2),below:true});CIRC.comp(g,"R",x3,y2,xb,y2,{size:50,label:nm(3),below:true});}}
$("chk").onclick=()=>{const a=parseFloat($("qa").value);const ok=isFinite(a)&&Math.abs(a-P.ans)<=0.02*Math.abs(P.ans);$("fb").innerHTML=`<div class="${ok?"good":"bad"}"><b>${ok?"Correct.":"Not yet."}</b> ${ok?"":"Use the steps below to find your error."} Answer: ${sf(P.ans)} ${P.u}</div>`;};
$("next").onclick=()=>{if(shown<P.steps.length){shown++;$("steps").innerHTML=P.steps.slice(0,shown).map((s,i)=>`<div>${i+1}. ${s}</div>`).join("");}};
$("all").onclick=()=>{shown=P.steps.length;$("steps").innerHTML=P.steps.map((s,i)=>`<div>${i+1}. ${s}</div>`).join("");};$("new").onclick=gen;
/* what happens if */
let closed=false,WQ={};const WR={E:12,R1:10,R2:20,R3:20};
function wsolve(c){const Rp=c?1/(1/WR.R2+1/WR.R3):WR.R2;const RT=WR.R1+Rp,I=WR.E/RT;return{RT,I,V1:I*WR.R1,V2:I*Rp};}
function wdraw(){const {g,w,h}=setup($("wc"),0.7);const L=50,Rr=w-40,T=80,B=h-50,xm=L+(Rr-L)*0.38,xa=xm+20,xb=Rr-30,y2=T+(B-T)*0.48;
 CIRC.wire(g,[[L,T],[L,B],[Rr,B],[Rr,T]]);CIRC.comp(g,"battery",L,B,L+(Rr-L)*0.3,B,{size:36,label:"12 V",below:true});CIRC.comp(g,"A",L+(Rr-L)*0.45,B,L+(Rr-L)*0.65,B,{size:40});
 CIRC.comp(g,"R",L,T,xm,T,{size:56,label:"R₁ = 10 Ω",below:true});CIRC.wire(g,[[xm,T],[xa,T],[xa,y2]]);CIRC.wire(g,[[xb,T],[xb,y2]]);CIRC.wire(g,[[xb,T],[Rr,T]]);CIRC.dot(g,xa,T);CIRC.dot(g,xb,T);
 CIRC.comp(g,"R",xa,T,xb,T,{size:56,label:"R₂ = 20 Ω",below:true});const x3=(xa+xb)/2;CIRC.comp(g,closed?"switchC":"switchO",xa,y2,x3,y2,{size:40});CIRC.comp(g,"R",x3,y2,xb,y2,{size:50,label:"R₃ = 20 Ω",below:true});
 CIRC.wire(g,[[L,T],[L,T-46],[(L+xm)/2-20,T-46]]);CIRC.comp(g,"V",(L+xm)/2-20,T-46,(L+xm)/2+20,T-46,{size:34});CIRC.wire(g,[[(L+xm)/2+20,T-46],[xm,T-46],[xm,T]]);
 const s=wsolve(closed);$("wst").innerHTML=`<div>switch ${closed?"closed":"open"}: R<sub>T</sub> = ${sf(s.RT)} Ω, ammeter ${sf(s.I)} A</div><div>voltmeter (across R₁) = ${sf(s.V1)} V; pd across R₂ = ${sf(s.V2)} V</div>`;}
function wnew(){WQ=pick([{q:"When the switch is closed, what happens to the ammeter reading?",a:"increases",why:"R₃ joins R₂ in parallel, so R<sub>T</sub> falls and I = ε/R<sub>T</sub> rises."},{q:"When the switch is closed, what happens to the voltmeter reading (across R₁)?",a:"increases",why:"More current flows through R₁, so V₁ = IR₁ rises."},{q:"When the switch is closed, what happens to the pd across R₂?",a:"decreases",why:"V₁ rises, and V₁ + V₂ = ε stays 12 V, so V₂ must fall."},{q:"When the switch is closed, what happens to the current through R₂?",a:"decreases",why:"The pd across R₂ falls and R₂ is fixed, so I₂ = V₂/R₂ falls."}]);
 closed=false;$("sw").textContent="Close the switch";$("wq").innerHTML=WQ.q;$("wfb").innerHTML="";wdraw();
 $("wopts").innerHTML=["increases","decreases","stays the same"].map(o=>`<button class="ghost" data-o="${o}">${o}</button>`).join("");
 document.querySelectorAll("#wopts button").forEach(b=>b.onclick=()=>{const ok=b.dataset.o===WQ.a;$("wfb").innerHTML=`<div class="${ok?"good":"bad"}"><b>${ok?"Correct":"Not quite"}</b>: it ${WQ.a}.</div><div>${WQ.why}</div><div><button class="ghost" id="wn">Next question</button></div>`;$("wn").onclick=wnew;});}
$("sw").onclick=()=>{closed=!closed;$("sw").textContent=closed?"Open the switch":"Close the switch";wdraw();};
tabs(t=>{if(t==="solve")draw();if(t==="what")wdraw();});onResize(()=>{draw();wdraw();});gen();wnew();
</script>
