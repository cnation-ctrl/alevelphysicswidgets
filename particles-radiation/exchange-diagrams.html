<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exchange Particle Diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard tool, one wide working panel under a slim header; large type for projection */
:root{
  --bg:#EEF3FA; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D3DCE9;
  --accent:#2F5DCC; --accent-ink:#FFFFFF; --warm:#D9661A; --good:#18915A; --bad:#C2372F; --soft:#E3EBF8;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#16213A; --ink:#E9EFF9; --muted:#A0ACC2; --line:#2B3A57;
  --accent:#86A8FF; --accent-ink:#0E1524; --warm:#F2A05A; --good:#4FCB8F; --bad:#F07B72; --soft:#1F2D4C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
header.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top .spec{font-family:var(--mono);font-size:15px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:20px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.ghost{font:inherit;font-weight:700;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(24px,3vw,34px);font-weight:600}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:18px}
.steps div{padding:6px 10px;background:var(--soft);border-radius:8px;overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .warm{color:var(--warm)}
.chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.formula{font-family:var(--mono);font-size:20px;padding:10px 14px;background:var(--soft);border-radius:10px;overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px}
.kv b{font-weight:700}
.note{font-size:16px;color:var(--muted)}
.callout{border-left:5px solid var(--warm);background:var(--soft);padding:10px 14px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
</style>
<style>body{margin:0}img{max-width:100%}select{max-width:100%;width:100%}.row>div{min-width:min(100%,150px)!important}</style>
<script>
const $=id=>document.getElementById(id);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const EPS0=8.85e-12, K=1/(4*Math.PI*8.85e-12), E_CH=1.60e-19, ME_=9.11e-31, MP=1.673e-27, G=6.67e-11;
/* number in standard form as HTML, n significant figures */
function sf(x,n=3){
  if(x===0)return "0";
  if(!isFinite(x))return "∞";
  const neg=x<0;x=Math.abs(x);
  let e=Math.floor(Math.log10(x));let m=x/Math.pow(10,e);let ms=m.toPrecision(n);
  if(parseFloat(ms)>=10){e++;ms=(m/10).toPrecision(n);}
  let s;
  if(e>=-2&&e<n&&e<=3){s=x.toPrecision(n);if(s.includes("e"))s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";}
  else s=ms+" × 10<sup>"+String(e).replace("-","−")+"</sup>";
  return (neg?"−":"")+s;
}
/* plain-text version for canvas labels */
function sft(x,n=3){return sf(x,n).replace(/<sup>/g,"^").replace(/<\/sup>/g,"").replace(" × 10^","e").replace(/e(−?\d+)/,(a,b)=>"×10"+sup(b));}
function sup(s){const m={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","−":"⁻","-":"⁻"};return String(s).split("").map(c=>m[c]||c).join("");}
function setup(c,aspect){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth||600,h=Math.round(w*aspect);
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+"px";
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  return {g,w,h};
}
function niceStep(range,target){const raw=range/target;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
/* axes: box {x,y,w,h}; returns mapping functions */
function axes(g,box,xmin,xmax,ymin,ymax,opt={}){
  const X=x=>box.x+(x-xmin)/(xmax-xmin)*box.w, Y=y=>box.y+box.h-(y-ymin)/(ymax-ymin)*box.h;
  const ink=cv("--ink"),line=cv("--line"),muted=cv("--muted");
  g.save();g.font="14px "+cv("--body");g.lineWidth=1;
  const xs=opt.xstep||niceStep(xmax-xmin,6), ys=opt.ystep||niceStep(ymax-ymin,5);
  g.strokeStyle=line;g.fillStyle=muted;g.textAlign="center";g.textBaseline="top";
  for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9*xs;x+=xs){g.beginPath();g.moveTo(X(x),box.y);g.lineTo(X(x),box.y+box.h);g.stroke();g.fillText(opt.xfmt?opt.xfmt(x):+x.toPrecision(3),X(x),Math.min(box.y+box.h,Math.max(box.y,Y(0)))+4);}
  g.textAlign="right";g.textBaseline="middle";
  for(let y=Math.ceil(ymin/ys)*ys;y<=ymax+1e-9*ys;y+=ys){g.beginPath();g.moveTo(box.x,Y(y));g.lineTo(box.x+box.w,Y(y));g.stroke();g.fillText(opt.yfmt?opt.yfmt(y):+y.toPrecision(3),box.x-6,Y(y));}
  g.strokeStyle=ink;g.lineWidth=2;g.beginPath();
  const y0=Math.min(box.y+box.h,Math.max(box.y,Y(0)));g.moveTo(box.x,y0);g.lineTo(box.x+box.w,y0);
  g.moveTo(box.x,box.y);g.lineTo(box.x,box.y+box.h);g.stroke();
  g.fillStyle=ink;g.font="bold 15px "+cv("--body");
  if(opt.xl){g.textAlign="right";g.textBaseline="bottom";g.fillText(opt.xl,box.x+box.w,y0-4);}
  if(opt.yl){g.textAlign="left";g.textBaseline="top";g.fillText(opt.yl,box.x+6,box.y-2);}
  g.restore();
  return {X,Y};
}
function arrow(g,x1,y1,x2,y2,col,wid=3,head=10){
  const a=Math.atan2(y2-y1,x2-x1);g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=wid;
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));g.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));g.closePath();g.fill();g.restore();
}
function tabs(onchange){
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
    document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab);
    if(onchange)onchange(b.dataset.tab);
  }));
}
function onResize(f){let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(f,80);});
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",f);}

</script>
</head>
<body>
<div class="wrap">
<header class="top"><h1>Exchange Particle Diagrams</h1><span class="spec">AQA 7408 · 3.2.1.4 · particle interactions</span></header>
<div class="tabs" role="tablist"><button data-tab="see" aria-selected="true">Step through a diagram</button><button data-tab="quiz" aria-selected="false">Quiz: choose the exchange particle</button></div>
<div data-panel="see" class="grid2">
 <div class="panel">
  <canvas id="cv" aria-label="Exchange particle diagram"></canvas>
  <div class="row" style="margin-top:10px"><button class="ghost" id="back">◀ Back</button><button class="go" id="next">Next step ▶</button><span class="chip" id="stepn"></span></div>
 </div>
 <div class="panel">
  <label for="pick">Interaction</label><select id="pick"></select>
  <div class="steps" id="info" style="margin-top:12px"></div>
  <div class="callout" style="margin-top:12px" id="note"></div>
 </div>
</div>
<div data-panel="quiz" class="grid2" hidden>
 <div class="panel"><canvas id="qcv" aria-label="Quiz diagram with the exchange particle hidden"></canvas></div>
 <div class="panel">
  <div class="big" id="qtitle" style="font-size:24px"></div>
  <p>Which exchange particle goes in the box, and which way does it go?</p>
  <div class="row" id="qbtn"></div>
  <div class="callout" style="margin-top:14px" id="qfb">Pick an answer.</div>
  <div class="row" style="margin-top:12px"><button class="go" id="qnext">Next question</button><span class="chip" id="score">Score 0 / 0</span></div>
 </div>
</div>
</div>
<script>
/* each: [title, bottom-left, top-left, bottom-right, top-right, boson, wavy?, dir(1: left to right), force, notes[] ] */
const INT=[
 ["Electron–electron repulsion","e⁻","e⁻","e⁻","e⁻","γ",1,0,"electromagnetic","The exchange particle is a virtual photon. It carries momentum from one electron to the other, so they push apart. Charge is the same at each vertex, so the photon has no charge."],
 ["β⁻ decay","n","p","","e⁻ and ν̄ₑ","W⁻",0,1,"weak","At the left vertex a neutron turns into a proton: charge 0 → +1, so a W⁻ must leave (0 = +1 + (−1)). The W⁻ decays into an electron and an electron antineutrino."],
 ["β⁺ decay","p","n","","e⁺ and νₑ","W⁺",0,1,"weak","A proton turns into a neutron, so a W⁺ leaves (+1 = 0 + 1). The W⁺ decays into a positron and an electron neutrino. (Only inside a nucleus: a free proton cannot do this.)"],
 ["Electron capture","p","n","e⁻","νₑ","W⁺",0,1,"weak","An inner-shell electron is captured by a proton. The proton changes to a neutron and emits a W⁺, which meets the electron and becomes an electron neutrino. p + e⁻ → n + νₑ"],
 ["Electron–proton collision","p","n","e⁻","νₑ","W⁻",0,-1,"weak","Same particles as electron capture, but the electron is a fast projectile. The electron emits a W⁻ and becomes a neutrino; the W⁻ turns the proton into a neutron. p + e⁻ → n + νₑ"]];
$("pick").innerHTML=INT.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("");
let step=3;
function diag(c,I,st,hide){const S=setup(c,0.95),g=S.g,w=S.w,h=S.h;
 const L=w*0.28,R=w*0.72,vy=h*0.5,top=h*0.12,bot=h*0.88;const ink=cv("--ink"),acc=cv("--accent"),warm=cv("--warm");
 g.font="bold 22px "+cv("--body");g.textAlign="center";g.textBaseline="middle";
 const decay=I[3]==="";
 if(st>=1){arrow(g,L-w*0.12,bot,L,vy,ink,3,13);g.fillStyle=ink;g.fillText(I[1],L-w*0.14,bot+18);if(!decay){arrow(g,R+w*0.12,bot,R,vy,ink,3,13);g.fillText(I[3],R+w*0.14,bot+18);}}
 if(st>=2){if(hide){g.strokeStyle=warm;g.lineWidth=3;g.setLineDash([8,6]);g.strokeRect(w*0.42,vy-26,w*0.16,52);g.setLineDash([]);g.fillStyle=warm;g.fillText("?",w/2,vy);}
  else{g.strokeStyle=warm;g.lineWidth=3;g.beginPath();
   if(I[6]){for(let x=L;x<=R;x+=2){const y=vy+Math.sin((x-L)/8)*8;x===L?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();}
   else{g.setLineDash([10,6]);g.moveTo(L,vy);g.lineTo(R,vy);g.stroke();g.setLineDash([]);if(I[7]===1)arrow(g,w*0.45,vy,w*0.56,vy,warm,3,14);if(I[7]===-1)arrow(g,w*0.55,vy,w*0.44,vy,warm,3,14);}
   g.fillStyle=warm;g.fillText(I[5],w/2,vy-26);}}
 if(st>=3){arrow(g,L,vy,L-w*0.12,top,ink,3,13);g.fillStyle=ink;g.fillText(I[2],L-w*0.14,top-18);
  if(decay){arrow(g,R,vy,R+w*0.12,top,ink,3,13);arrow(g,R,vy,R+w*0.16,vy+h*0.18,ink,3,13);const pr=I[4].split(" and ");g.fillText(pr[0],R+w*0.15,top-18);g.fillText(pr[1],R+w*0.2,vy+h*0.18+20);}
  else{arrow(g,R,vy,R+w*0.12,top,ink,3,13);g.fillText(I[4],R+w*0.14,top-18);}}
 g.fillStyle=cv("--muted");g.font="14px "+cv("--body");g.textAlign="left";arrow(g,16,bot,16,top,cv("--muted"),2,9);g.save();g.translate(30,h/2);g.rotate(-Math.PI/2);g.textAlign="center";g.fillText("time",0,0);g.restore();}
const STEPS=["Start","1. Incoming particles (bottom: time runs upwards)","2. The exchange particle carries momentum, energy and charge","3. Outgoing particles"];
function show(){const I=INT[+$("pick").value];diag($("cv"),I,step,false);$("stepn").textContent=STEPS[step];
 $("info").innerHTML=`<div>interaction: ${I[8]}</div><div>exchange particle: ${I[5]}${I[6]?" (virtual photon)":""}</div>${step>=3?`<div>${I[0]==="β⁻ decay"?"n → p + e⁻ + ν̄ₑ":I[0]==="β⁺ decay"?"p → n + e⁺ + νₑ":I[0].startsWith("Electron–e")?"e⁻ + e⁻ → e⁻ + e⁻":"p + e⁻ → n + νₑ"}</div>`:""}`;$("note").textContent=step>=2?I[9]:"Press Next step to build the diagram.";}
$("next").onclick=()=>{step=Math.min(3,step+1);show();};$("back").onclick=()=>{step=Math.max(0,step-1);show();};$("pick").addEventListener("input",()=>{step=0;show();});
let q=0,sc=0,tot=0,answered=false;const OPTS=["γ","W⁺ →","W⁻ →","W⁻ ←"];
function key(I){return I[6]?"γ":I[5]+(I[7]===1?" →":" ←");}
function quiz(){const I=INT[q];answered=false;diag($("qcv"),I,3,true);$("qtitle").textContent=I[0];
 $("qbtn").innerHTML=OPTS.map(o=>`<button class="ghost" data-o="${o}">${o}</button>`).join("");$("qfb").textContent="Pick an answer.";
 document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;tot++;const ok=b.dataset.o===key(I);if(ok)sc++;
  $("qfb").innerHTML=(ok?`<b class="good">Correct.</b> `:`<b class="bad">Not quite: it is ${key(I)}.</b> `)+I[9];$("score").textContent=`Score ${sc} / ${tot}`;diag($("qcv"),I,3,false);});}
$("qnext").onclick=()=>{q=(q+1+Math.floor(Math.random()*(INT.length-1)))%INT.length;quiz();};
tabs(t=>{if(t==="quiz")quiz();else show();});onResize(()=>{show();});show();
</script>
</body></html>
